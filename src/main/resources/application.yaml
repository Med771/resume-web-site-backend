spring:
  application:
    name: resume-web-site-backend

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://localhost:5501/resume
    username: Resume
    password: Resume!01156
    name: resume
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

logging:
  level:
    root: INFO
    ru.ai.sin: INFO

  file:
    name: logs/app.log

app:
  logging:
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    max-history: 7
    rotation-pattern: "logs/app.%d{yyyy-MM-dd}.gz"

  file:
    path: file
    max-size-bytes: 10485760

  registration:
    rate-limit-per-ip-per-hour: 10
    rate-limit-recruiter-per-ip-per-hour: 5
    max-skills-per-profile: 30
    max-experiences-in-registration: 12
    max-institutions-in-registration: 8
    min-password-length: 12
    require-letter-and-digit: true
    max-catalog-page-size: 50

  analytics:
    rate-limit-per-ip-per-minute: 300

  telegram:
    enabled: ${APP_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    verification-ttl-minutes: 15
    allow-dev-confirm: true
    dev-confirm-code: "7890"

  user:
    logins:
      - username: admin
        password: admin
        role: ADMIN

  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://localhost:8080"
        - "http://localhost:5371"
        - "http://localhost:5372"
        - "https://api.singularity-resume.ru"
        - "https://singularity-resume.ru"
        - "https://admin.singularity-resume.ru"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"
        - "HEAD"
      allowed-headers:
        - "Content-Type"
        - "Authorization"
      allow-credentials: true
      max-age: 3600

    csp:
      policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none';"

  jwt:
    access-secret: "mySuperSecretKeyThatShouldBeVeryLongAndSecure123!"
    refresh-secret: "mySuperSecretKeyThatShouldBeVeryLongAndSecure123!"

    issuer: "Singularity-backend"
    audience: "Singularity-frontend"

    access-token-ttl: 604800
    refresh-token-ttl: 2592000

    cookie:
      access-token-name: "ACCESS_TOKEN"
      refresh-token-name: "REFRESH_TOKEN"
      http-only: true
      secure: false
      same-site: Strict
      path: "/"


  swagger:
    title: "Resume API"
    description: "Документация API"
    version: "0.1.0"

    servers:
      - url: "http://localhost:8080"
        description: "Local Dev Server"

springdoc:
  swagger-ui:
    enabled: true

  api-docs:
    enabled: true

kind: Application
