spring:
  application:
    name: resume-web-site-backend

  datasource:
    url: jdbc:postgresql://localhost:5501/resume
    username: Resume
    password: Resume!01156
    name: resume
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    ru.ai.sin: INFO

  file:
    name: logs/app.log

app:
  logging:
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    max-history: 7
    rotation-pattern: "logs/app.%d{yyyy-MM-dd}.gz"

  file:
    path: file
    max-size-bytes: 5242880

  user:
    logins:
      - username: guest
        password: guest
        role: GUEST
      - username: user
        password: user
        role: USER
      - username: admin
        password: admin
        role: ADMIN

  security:
    cors:
      allowed-origins:
        - "http://localhost:8080"
        - "https://api.singularity-resume.ru"
        - "https://singularity-resume.ru"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"
        - "HEAD"
      allowed-headers:
        - "Content-Type"
        - "Authorization"
      allow-credentials: true
      max-age: 3600

    csp:
      policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none';"

  jwt:
    access-secret: "mySuperSecretKeyThatShouldBeVeryLongAndSecure123!"
    refresh-secret: "mySuperSecretKeyThatShouldBeVeryLongAndSecure123!"

    issuer: "Singularity-backend"
    audience: "Singularity-frontend"

    access-token-ttl: 604800
    refresh-token-ttl: 2592000

    cookie:
      access-token-name: "ACCESS_TOKEN"
      refresh-token-name: "REFRESH_TOKEN"
      http-only: true
      secure: false
      same-site: Strict
      path: "/"


  swagger:
    title: "Resume API"
    description: "Документация API"
    version: "0.1.0"

    servers:
      - url: "http://localhost:8080"
        description: "Local Dev Server"
      - url: "https://api.example.com"
        description: "Production Server"

  fast:
    url: "http://localhost:8000/create_chat"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

  api-docs:
    enabled: true
